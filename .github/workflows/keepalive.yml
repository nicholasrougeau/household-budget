name: keep-database-awake
# Free Supabase projects pause after a quiet week. A daily ping that touches the database prevents that.
on:
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the API
        run: curl -fsS https://jswppnwbjisvwkgntrtn.supabase.co/functions/v1/api/health
      - uses: actions/checkout@v4
      - name: Keep this schedule on (GitHub disables schedules after 60 days without commits)
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 45 * 86400 )) ]; then
            git config user.name "keepalive"
            git config user.email "keepalive@users.noreply.github.com"
            git commit --allow-empty -m "keepalive"
            git push
          fi
